name: weby
description: "Weby - a privacy-focused Android voice assistant."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Networking
  dio: ^5.6.0

  # Secure credential storage (access/refresh tokens)
  flutter_secure_storage: ^9.2.2

  # Non-sensitive local prefs (theme, onboarding flags)
  shared_preferences: ^2.3.2

  # Firebase (core + auth) - backs "Sign in with Google"
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

  # Google Sign-In (used together with firebase_auth to obtain a Google
  # credential, which is then exchanged for a Firebase ID token)
  google_sign_in: ^6.2.1

  # Realtime (used sparingly, per spec, where it adds real value -
  # e.g. live transcript / assistant state push during a session)
  web_socket_channel: ^3.0.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
