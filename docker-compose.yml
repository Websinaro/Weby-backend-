# Local development stack: backend + Postgres.
# Usage: docker compose up --build
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: weby
      POSTGRES_PASSWORD: weby
      POSTGRES_DB: weby
    ports:
      - "5432:5432"
    volumes:
      - weby_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weby"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://weby:weby@postgres:5432/weby?schema=public

volumes:
  weby_postgres_data:
